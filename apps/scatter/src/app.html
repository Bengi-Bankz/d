<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			body.font-loading {
				visibility: hidden;
			}
		</style>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="stylesheet" href="./app.css" />
		<meta name="viewport" content="width=device-width" />
		%sveltekit.head%
	</head>
	<body style="margin: 0; padding: 0; overflow: hidden; background-color: black">
		<script>
			// Suppress all console output globally
			console.log = () => {};
			console.warn = () => {};
			console.error = () => {};
			console.info = () => {};
			console.debug = () => {};

			// Hide body until font is loaded
			document.body.classList.add('font-loading');
			const font = new FontFace('BungeeSpice-Regular', 'url(./BungeeSpice-Regular.ttf)');
			font
				.load()
				.then(function (loadedFont) {
					document.fonts.add(loadedFont);
					document.body.classList.remove('font-loading');
				})
				.catch(function () {
					// If font fails to load, still show the page
					document.body.classList.remove('font-loading');
				});
		</script>
		<div>%sveltekit.body%</div>
	</body>
</html>
